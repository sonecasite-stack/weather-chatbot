<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Weather Chatbot</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --primary: #007bff;
            --text-user: #ffffff;
            --text-bot: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #chat-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
        }
        #chat-window {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .user {
            background-color: var(--primary);
            color: var(--text-user);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .bot {
            background-color: #e9ecef;
            color: var(--text-bot);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 10px;
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            outline: none;
        }
        button {
            border: none;
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        #mic-btn.recording {
            background: #dc3545;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="chat-header">⛅ Weather Chatbot (English Practice)</div>
    <div id="chat-window"></div>
    <div id="input-container">
        <input type="text" id="text-input" placeholder="Type a message about the weather..." autocomplete="off">
        <button id="send-btn" title="Send text">➔</button>
        <button id="mic-btn" title="Speak">🎤</button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const textInput = document.getElementById('text-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');

    // Base de respostas locais (Offline NLP simples baseada em palavras-chave)
    const weatherResponses = {
        greeting: [
            "Hello! Let's talk about the weather. How is the weather today?",
            "Hi there! Beautiful day to chat. How's the weather where you are?"
        ],
        sunny: [
            "That's great! Don't forget your sunglasses and sunscreen.",
            "I love sunny days! It's perfect for a walk in the park."
        ],
        rainy: [
            "Oh, make sure to take an umbrella if you go out.",
            "Rainy days are perfect for staying inside with a hot cup of tea."
        ],
        cloudy: [
            "A bit gloomy, isn't it? I hope the sun comes out later.",
            "Cloudy days can be nice and cool, at least it's not pouring rain."
        ],
        cold: [
            "Brrr! Stay warm and wear a thick jacket or a coat.",
            "Winter vibes! Time for hot chocolate and cozy blankets."
        ],
        hot: [
            "Wow, stay hydrated! Drink plenty of water today.",
            "It sounds like a perfect day to eat some ice cream or go to the pool."
        ],
        default: [
            "Interesting! Weather can be very unpredictable. Do you prefer hot or cold weather?",
            "Tell me more, is it windy, rainy, or warm right now?"
        ]
    };

    // Configuração de Reconhecimento de Voz (Entrada)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // Força a entrada em inglês
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            micBtn.classList.add('recording');
            isRecording = true;
        };

        recognition.onend = () => {
            micBtn.classList.remove('recording');
            isRecording = false;
        };

        recognition.onresult = (event) => {
            const speechToText = event.results[0][0].transcript;
            textInput.value = speechToText;
            handleUserMessage(speechToText);
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error", event.error);
            micBtn.classList.remove('recording');
            isRecording = false;
        };
    } else {
        micBtn.style.display = 'none';
        console.warn("Speech Recognition not supported in this browser.");
    }

    // Configuração de Síntese de Voz (Saída)
    function speak(text) {
        if ('speechSynthesis' in window) {
            // Cancela vozes anteriores a falar para evitar sobreposição
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // Garante pronúncia em inglês
            
            // Tenta selecionar uma voz nativa em inglês (opcional)
            const voices = window.speechSynthesis.getVoices();
            const enVoice = voices.find(voice => voice.lang.startsWith('en-'));
            if (enVoice) utterance.voice = enVoice;

            window.speechSynthesis.speak(utterance);
        }
    }

    // Lógica do Chatbot
    function appendMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);
        messageDiv.innerText = text;
        chatWindow.appendChild(messageDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function getBotResponse(input) {
        const text = input.toLowerCase();
        
        if (text.includes('hello') || text.includes('hi') || text.includes('hey')) {
            return getRandomResponse('greeting');
        } else if (text.includes('sun') || text.includes('sunny') || text.includes('clear')) {
            return getRandomResponse('sunny');
        } else if (text.includes('rain') || text.includes('rainy') || text.includes('wet')) {
            return getRandomResponse('rainy');
        } else if (text.includes('cloud') || text.includes('cloudy') || text.includes('grey')) {
            return getRandomResponse('cloudy');
        } else if (text.includes('cold') || text.includes('freezing') || text.includes('snow')) {
            return getRandomResponse('cold');
        } else if (text.includes('hot') || text.includes('warm') || text.includes('boiling')) {
            return getRandomResponse('hot');
        } else {
            return getRandomResponse('default');
        }
    }

    function getRandomResponse(category) {
        const responses = weatherResponses[category];
        const index = Math.floor(Math.random() * responses.length);
        return responses[index];
    }

    function handleUserMessage(message) {
        if (!message.trim()) return;
        
        appendMessage('user', message);
        textInput.value = '';

        // Simula uma pequena latência de resposta para parecer mais natural
        setTimeout(() => {
            const botResponse = getBotResponse(message);
            appendMessage('bot', botResponse);
            speak(botResponse);
        }, 600);
    }

    // Event Listeners
    sendBtn.addEventListener('click', () => {
        handleUserMessage(textInput.value);
    });

    textInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleUserMessage(textInput.value);
        }
    });

    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    });

    // Mensagem inicial de boas-vindas ao carregar
    window.addEventListener('load', () => {
        setTimeout(() => {
            const welcome = "Hello! I am your offline weather assistant. How is the weather today?";
            appendMessage('bot', welcome);
            // Nota: Alguns navegadores bloqueiam o som automático até ao primeiro clique do utilizador
        }, 500);
    });
</script>

</body>
</html>
